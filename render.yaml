services:
  - type: web
    name: cajero-u3-web
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /health
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: "3000"
      - key: APP_ENV
        value: Render gratuito
      - key: DATABASE_URL
        fromDatabase:
          name: cajero-u3-db
          property: connectionString
databases:
  - name: cajero-u3-db
    databaseName: cajero
    user: cajero
    region: oregon
    plan: free
    ipAllowList: []
